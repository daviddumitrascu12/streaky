<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Streaky</title>
  <style>
    body { width: 320px; margin: 0; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #081018; color: #fff; }
    .hero { padding: 14px 16px 10px; background: radial-gradient(circle at 80% 0%, rgba(255,111,0,.38), transparent 46%), linear-gradient(135deg, #111a24, #080b10); border-bottom: 1px solid rgba(255,255,255,.08); }
    h1 { margin: 0; font-size: 17px; }
    .sub { margin-top: 4px; font-size: 12px; color: rgba(255,255,255,.72); }
    .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 12px 16px 4px; }
    .stat { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.08); border-radius: 12px; padding: 9px; text-align: center; }
    .n { font-size: 24px; font-weight: 900; color: #ffd17d; }
    .l { font-size: 11px; color: rgba(255,255,255,.7); }
    form { padding: 12px 16px; display: grid; gap: 9px; }
    label { font-size: 11px; font-weight: 800; color: #ffd17d; }
    input { box-sizing: border-box; width: 100%; border: 1px solid rgba(255,255,255,.13); border-radius: 10px; padding: 9px 10px; background: rgba(255,255,255,.08); color: white; outline: none; }
    input:focus { border-color: #ff9e27; box-shadow: 0 0 0 3px rgba(255,158,39,.15); }
    button { border: 0; border-radius: 10px; padding: 10px; font-weight: 900; cursor: pointer; background: linear-gradient(135deg, #ff6b00, #ffd35a); color: #1b0b00; }
    .row { display:grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .secondary { background: rgba(255,255,255,.08); color: white; border:1px solid rgba(255,255,255,.1); }
    .status { padding: 0 16px 12px; font-size: 12px; color: rgba(255,255,255,.74); line-height:1.35; }
    a { color: #ffd17d; text-decoration: none; }
  </style>
</head>
<body>
  <div class="hero">
    <h1>🔥 Streaky</h1>
    <div class="sub">Name setzen → Datenbank-Sync → Leaderboard</div>
  </div>
  <div class="stats">
    <div class="stat"><div class="n" id="streak">0</div><div class="l">Streak</div></div>
    <div class="stat"><div class="n" id="best">0</div><div class="l">Best</div></div>
    <div class="stat"><div class="n" id="correct">0</div><div class="l">Richtig</div></div>
  </div>
  <form id="form">
    <div>
      <label for="username">Dein Leaderboard-Name</label>
      <input id="username" maxlength="32" placeholder="z.B. David" autocomplete="off" required />
    </div>
    <div>
      <label for="serverUrl">Leaderboard-Server</label>
      <input id="serverUrl" placeholder="http://localhost:3000" />
    </div>
    <button type="submit">Speichern & synchronisieren</button>
    <div class="row">
      <button type="button" class="secondary" id="togglePause">Pause</button>
      <button type="button" class="secondary" id="reset">Reset</button>
    </div>
  </form>
  <div class="status" id="status">Lade…</div>
  <script src="popup.js"></script>
</body>
</html>

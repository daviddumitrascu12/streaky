<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Streaky</title>
  <style>
    :root {
      --bg: #0d1118;
      --card: rgba(255,255,255,.08);
      --line: rgba(255,255,255,.09);
      --text: #ffffff;
      --muted: rgba(255,255,255,.7);
      --accent: #ff7a18;
      --accent2: #ffb340;
      --buttonText: #241400;
    }
    :root[data-theme="light"] {
      --bg: #f5f7fb;
      --card: rgba(255,255,255,.9);
      --line: rgba(10,20,40,.1);
      --text: #1f2837;
      --muted: rgba(31,40,55,.72);
      --accent: #ff7a18;
      --accent2: #ffcb5c;
      --buttonText: #241400;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; width: 360px; min-height: 420px; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text); background:
        radial-gradient(circle at 80% 0%, rgba(255,117,24,.22), transparent 30%),
        radial-gradient(circle at 0% 100%, rgba(255,202,92,.16), transparent 28%),
        var(--bg);
    }
    .wrap { padding: 16px; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom: 14px; }
    h1 { margin: 0; font-size: 26px; letter-spacing: -.05em; }
    .toggle {
      border:1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px; padding: 8px 12px;
      font-size: 12px; font-weight: 800; cursor: pointer;
    }
    .hero { border:1px solid var(--line); background: var(--card); border-radius: 20px; overflow:hidden; box-shadow: 0 18px 50px rgba(0,0,0,.22); }
    .mascot { display:grid; place-items:center; padding: 12px 0 0; }
    .mascot img { width: 94px; height: 94px; object-fit: contain; filter: drop-shadow(0 8px 18px rgba(255,122,24,.25)); }
    .stats { display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; padding: 8px 14px 14px; }
    .stat { border:1px solid var(--line); background: rgba(255,255,255,.05); border-radius: 16px; padding: 12px 8px; text-align:center; }
    .n { font-weight:1000; font-size: 28px; line-height:1; }
    .l { color: var(--muted); font-size: 12px; margin-top: 5px; }
    form { margin-top: 14px; display:grid; gap: 12px; }
    label { display:block; margin-bottom: 6px; font-size: 12px; font-weight: 800; color: var(--muted); }
    input { width:100%; border:1px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 14px; outline:none; background: var(--card); color: var(--text); }
    .grid { display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button.primary, button.secondary, button.leaderboard { border:0; border-radius: 14px; padding: 12px 14px; font-size: 14px; font-weight: 900; cursor:pointer; }
    button.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: var(--buttonText); }
    button.secondary, button.leaderboard { background: var(--card); color: var(--text); border:1px solid var(--line); }
    button.leaderboard { width:100%; }
    .tiny { margin-top:10px; font-size: 11px; color: var(--muted); text-align:center; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <h1>🔥 Streaky</h1>
      <button type="button" class="toggle" id="themeToggle">🌙 Dark</button>
    </div>

    <div class="hero">
      <div class="mascot"><img id="mascot" src="assets/positive-streak/01.png" alt="Streaky Maskottchen" /></div>
      <div class="stats">
        <div class="stat"><div class="n" id="streak">0</div><div class="l">Richtig</div></div>
        <div class="stat"><div class="n" id="wrongStreak">0</div><div class="l">Falsch-Serie</div></div>
        <div class="stat"><div class="n" id="best">0</div><div class="l">Best</div></div>
      </div>
    </div>

    <form id="form">
      <div>
        <label for="username">Dein Leaderboard-Name</label>
        <input id="username" maxlength="32" placeholder="z.B. David" autocomplete="off" required />
      </div>
      <button type="button" class="leaderboard" id="openLeaderboard">🏆 Leaderboard öffnen</button>
      <div class="grid">
        <button type="submit" class="primary">Name speichern</button>
        <button type="button" class="secondary" id="syncNow">Jetzt syncen</button>
      </div>
    </form>
    <div class="tiny">Server fest eingebaut: streaky-zeta.vercel.app</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>

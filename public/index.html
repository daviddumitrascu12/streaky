<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Streaky Leaderboard</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080d14;
      --card: rgba(255,255,255,.06);
      --card2: rgba(255,255,255,.09);
      --text: #ffffff;
      --muted: rgba(255,255,255,.68);
      --line: rgba(255,255,255,.12);
      --accent: #ffd17d;
      --streak: #ffce61;
      --thbg: rgba(0,0,0,.2);
      --row1: linear-gradient(90deg, rgba(255,174,0,.18), transparent);
      --shadow: 0 20px 70px rgba(0,0,0,.38);
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f7f3ec;
      --card: rgba(255,255,255,.82);
      --card2: rgba(255,255,255,.95);
      --text: #15202b;
      --muted: rgba(21,32,43,.7);
      --line: rgba(20,30,50,.1);
      --accent: #b55c00;
      --streak: #cc6e00;
      --thbg: rgba(255,255,255,.85);
      --row1: linear-gradient(90deg, rgba(255,174,0,.15), rgba(255,255,255,0));
      --shadow: 0 20px 60px rgba(22,30,50,.12);
    }
    * { box-sizing:border-box; }
    body { margin: 0; min-height: 100vh; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--text); background: radial-gradient(circle at 80% 10%, rgba(255,107,0,.24), transparent 32%), radial-gradient(circle at 20% 80%, rgba(255,199,70,.16), transparent 30%), var(--bg); transition: background .2s ease, color .2s ease; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 36px 18px 48px; }
    header { display:grid; grid-template-columns: 1.1fr .9fr; gap:24px; align-items:center; margin-bottom: 22px; }
    h1 { margin:0; font-size: clamp(36px, 7vw, 76px); letter-spacing: -.06em; line-height: .9; text-shadow: 0 0 28px rgba(255,113,0,.28); }
    .sub { color: var(--muted); margin-top: 12px; font-size: 16px; max-width: 650px; }
    .heroCard { position:relative; min-height:280px; border:1px solid var(--line); border-radius:30px; background: var(--card); box-shadow: var(--shadow); overflow:hidden; display:grid; place-items:center; }
    .heroCard::before { content:""; position:absolute; inset:14px; border-radius:24px; background: radial-gradient(circle at 50% 75%, rgba(255,183,0,.28), transparent 34%); animation:pulse 2.2s ease-in-out infinite; }
    .heroMascot { position:relative; width:min(280px, 80%); height:auto; filter: drop-shadow(0 18px 36px rgba(255,98,0,.28)); animation:float 2.1s ease-in-out infinite; }
    .headerRight { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:20px; }
    .live, .themeBtn { padding: 10px 14px; border-radius: 999px; background: var(--card2); border: 1px solid var(--line); white-space: nowrap; }
    .live { color: var(--accent); font-weight: 900; }
    .themeBtn { color: var(--text); font-weight: 800; cursor:pointer; }
    .board { border: 1px solid var(--line); border-radius: 24px; overflow: hidden; background: var(--card); box-shadow: var(--shadow); backdrop-filter: blur(10px); }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 15px 16px; text-align:left; border-bottom: 1px solid rgba(255,255,255,.08); }
    th { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); background: var(--thbg); }
    tr:first-child td { background: var(--row1); }
    .rank { font-weight: 1000; color: var(--accent); width: 58px; }
    .player { display:flex; align-items:center; gap:12px; }
    .avatar { width:54px; height:54px; border-radius:16px; object-fit:contain; background:rgba(255,255,255,.08); border:1px solid var(--line); }
    .name { font-weight: 900; font-size: 18px; }
    .streak { font-size: 28px; font-weight: 1000; color: var(--streak); text-shadow: 0 0 16px rgba(255,99,0,.18); }
    .muted { color: var(--muted); font-size: 13px; }
    .empty { padding: 38px 18px; text-align:center; color: var(--muted); }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }
    @keyframes pulse { 0%,100%{opacity:.7; transform:scale(.96)} 50%{opacity:1; transform:scale(1.04)} }
    @media (max-width: 780px) { header{grid-template-columns:1fr;} .heroCard{min-height:220px;} .hideSmall { display:none; } th, td { padding: 12px 10px; } .name{font-size:15px} .streak{font-size:22px} .avatar{width:44px;height:44px;} }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>🔥 Streaky<br>Leaderboard</h1>
        <div class="sub">Dein AMBOSS-Streak wird automatisch synchronisiert. Je höher dein Streak, desto stärker wird dein Streaky-Maskottchen.</div>
        <div class="headerRight">
          <button class="themeBtn" id="themeToggle" type="button">🌙 Dark</button>
          <div class="live" id="live">LIVE</div>
        </div>
      </div>
      <div class="heroCard">
        <img class="heroMascot" src="/assets/positive-streak/10.png" alt="Streaky Maskottchen" />
      </div>
    </header>
    <div class="board">
      <table id="table" hidden>
        <thead><tr><th>#</th><th>Name</th><th>Streak</th><th>Best</th><th class="hideSmall">Richtig</th><th class="hideSmall">Falsch</th><th class="hideSmall">Zuletzt</th></tr></thead>
        <tbody id="body"></tbody>
      </table>
      <div class="empty" id="empty">Noch keine Einträge. Setze im Streaky-Add-on einen Namen und beantworte AMBOSS-Fragen.</div>
    </div>
  </div>
  <script>
    const body = document.getElementById('body');
    const table = document.getElementById('table');
    const empty = document.getElementById('empty');
    const live = document.getElementById('live');
    const themeToggle = document.getElementById('themeToggle');
    const THEME_KEY = 'streaky-theme';

    function applyTheme(theme) {
      const value = theme === 'light' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', value);
      themeToggle.textContent = value === 'light' ? '☀️ Light' : '🌙 Dark';
      localStorage.setItem(THEME_KEY, value);
    }
    applyTheme(localStorage.getItem(THEME_KEY) || 'dark');
    themeToggle.addEventListener('click', () => applyTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light'));

    function ago(ts) {
      if (!ts) return '—';
      const s = Math.max(0, Math.round((Date.now() - ts) / 1000));
      if (s < 60) return `${s}s`;
      const m = Math.round(s / 60);
      if (m < 60) return `${m}m`;
      const h = Math.round(m / 60);
      if (h < 48) return `${h}h`;
      return `${Math.round(h / 24)}d`;
    }

    function avatarFor(streak) {
      const level = Math.max(1, Math.min(10, Number(streak || 0) || 1));
      return `/assets/positive-streak/${String(level).padStart(2, '0')}.png`;
    }

    async function load() {
      try {
        const res = await fetch('/api/leaderboard', { cache: 'no-store' });
        const data = await res.json();
        const players = data.players || [];
        table.hidden = !players.length;
        empty.hidden = !!players.length;
        body.innerHTML = players.map((p, i) => `
          <tr>
            <td class="rank">${i + 1}</td>
            <td><div class="player"><img class="avatar" src="${avatarFor(p.streak)}" alt="" /><div><div class="name">${escapeHtml(p.username)}</div><div class="muted">${escapeHtml(p.lastEventText || '')}</div></div></div></td>
            <td class="streak">${p.streak} 🔥</td>
            <td>${p.best}</td>
            <td class="hideSmall">${p.totalCorrect}</td>
            <td class="hideSmall">${p.totalWrong}</td>
            <td class="hideSmall muted">vor ${ago(p.updatedAt)}</td>
          </tr>`).join('');
        live.textContent = `LIVE · ${new Date().toLocaleTimeString('de-DE')}`;
      } catch (e) {
        table.hidden = true;
        empty.hidden = false;
        empty.textContent = 'Server/API nicht erreichbar.';
        live.textContent = 'OFFLINE';
      }
    }
    function escapeHtml(s) { return String(s).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
    load();
    setInterval(load, 2000);
  </script>
</body>
</html>
